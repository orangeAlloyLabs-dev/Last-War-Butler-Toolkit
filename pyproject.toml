[project]
name = "last-war-butler-toolkit"
version = "0.1.0"
description = "A Python-based toolkit for Last War alliance management"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.0",
    "streamlit>=1.30",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "easyocr>=1.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
